name: Keep Streamlit Awake

on:
  schedule:
    # Runs at 12:00 UTC (8:00 AM EST) every single day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Puppeteer (Headless Browser Engine)
        run: npm install puppeteer
        
      - name: Wake up Streamlit via Real Browser Simulation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            console.log('Launching headless browser...');
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            
            console.log('Navigating to Streamlit app...');
            // networkidle0 ensures the script waits until all WebSockets and React elements fully render
            await page.goto('https://nba-finals-predictor-2026-izrjrrysjipdqjlrqbv5z7.streamlit.app/', { waitUntil: 'networkidle0', timeout: 60000 });
            
            console.log('App successfully loaded and WebSocket established. Container is awake.');
            await browser.close();
          })();
          "