name: Keep Streamlit Awake

on:
  schedule:
    # Runs at 12:00 UTC (8:00 AM EST) every single day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Puppeteer (Headless Browser Engine)
        run: npm install puppeteer
        
      - name: Wake up Streamlit via Real Browser Simulation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            console.log('Launching headless browser...');
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            
            console.log('Navigating to Streamlit app...');
            await page.goto('https://nba-finals-predictor-2026-izrjrrysjipdqjlrqbv5z7.streamlit.app/', { waitUntil: 'networkidle2', timeout: 60000 });
            
            // Check if the Streamlit 'Wake up app' button exists on the page
            const wakeUpButton = await page.evaluate(() => {
              const buttons = Array.from(document.querySelectorAll('button'));
              const target = buttons.find(b => b.textContent.includes('Wake up app'));
              if (target) {
                target.click();
                return true;
              }
              return false;
            });

            if (wakeUpButton) {
              console.log('Detected hibernation gateway. Clicked \"Wake up app\" button.');
              console.log('Waiting for container compilation (this can take up to 45 seconds)...');
              // Wait an extra 45 seconds for the cloud container to fully build and render your app
              await new Promise(r => setTimeout(r, 45000));
            } else {
              console.log('App was already awake. No bypass required.');
            }
            
            console.log('Verification complete. Container is verified active.');
            await browser.close();
          })();
          "